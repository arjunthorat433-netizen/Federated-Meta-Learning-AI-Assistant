[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federated-meta-learning"
version = "1.0.0"
license = {file = "LICENSE"}
description = "Federated Meta Learning Project using PyTorch and Flower"
dependencies = [
    "flwr[simulation]>=1.43.0",
    "torch",
    "numpy"
]
[tool.hatch.build.targets.wheel]
packages = ["federated_app"]

[tool.flwr.app]
publisher = "local"
fab-format-version = 1
flwr-version-target = "1.43.0"

[tool.flwr.app.components]
serverapp = "federated_app.server_app:app"
clientapp = "federated_app.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "LICENSE"